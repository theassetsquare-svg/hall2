name: Lighthouse CI (mobile + desktop, 10 pages)

on:
  schedule:
    # 매일 KST 12:30 = UTC 03:30
    - cron: '30 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: [mobile, desktop]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Lighthouse + Chrome
        run: |
          npm install -g lighthouse@12
          sudo apt-get update -qq
          sudo apt-get install -y -qq chromium-browser || sudo apt-get install -y -qq chromium

      - name: Run Lighthouse (${{ matrix.preset }})
        run: |
          mkdir -p lh-out
          URLS=(
            "https://hall2-cua.pages.dev/"
            "https://hall2-cua.pages.dev/blog/first/"
            "https://hall2-cua.pages.dev/blog/business/"
            "https://hall2-cua.pages.dev/blog/food/"
            "https://hall2-cua.pages.dev/blog/music/"
            "https://hall2-cua.pages.dev/blog/vip/"
            "https://hall2-cua.pages.dev/blog/compare/"
            "https://hall2-cua.pages.dev/blog/seasonal/"
            "https://hall2-cua.pages.dev/blog/private/"
            "https://hall2-cua.pages.dev/blog/after/"
          )
          for url in "${URLS[@]}"; do
            name=$(echo "$url" | sed -E 's|https://[^/]+/||; s|/$||; s|/|_|g')
            [ -z "$name" ] && name="home"
            echo "=== Lighthouse ${{ matrix.preset }} → $url ==="
            lighthouse "$url" \
              --preset=${{ matrix.preset == 'desktop' && 'desktop' || '' }} \
              --form-factor=${{ matrix.preset }} \
              --output=json --output=html \
              --output-path="lh-out/${{ matrix.preset }}-${name}" \
              --chrome-flags="--headless --no-sandbox --disable-gpu" \
              --quiet || echo "::warning::$url failed"
          done

      - name: Upload reports
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-${{ matrix.preset }}-${{ github.run_number }}
          path: lh-out/
          retention-days: 30
